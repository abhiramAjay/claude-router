[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-router"
version = "0.1.0"
description = "Route each prompt to a Claude model by complexity, using laya as a local classifier"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Abhiram A" }]
requires-python = ">=3.9"
keywords = ["claude", "anthropic", "llm", "routing", "claude-code", "subagents"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
]
dependencies = []          # the client is standard library only -- on purpose

[project.optional-dependencies]
# Only the sidecar host needs these. Projects install the bare package.
server = ["laya>=0.3.5"]
# For running example.py / calling the API from the same venv.
api = ["anthropic>=1.0"]
# Subagent routing inside the Claude Agent SDK (claude_router/agents.py).
agents = ["claude-agent-sdk>=0.2.157"]
# Training and serving the routing head. Needs [server] too, for the encoder.
head = ["scikit-learn>=1.3", "joblib>=1.3"]
# Client-side tests need no torch, so dev stays light.
dev = ["pytest>=7"]

[project.scripts]
laya-routerd = "claude_router.server:main"

[tool.setuptools]
packages = ["claude_router"]

[tool.setuptools.package-data]
# The trained routing head (13 KB). Without it the sidecar falls back to the
# far weaker difficulty score.
claude_router = ["routing_head.joblib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: loads the laya checkpoint (~20s); needs the [server] extra"]
addopts = "-q"
